<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroVision — Vision Cortex Training</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <div class="nav-brand">
        <div class="brand-badge">⚡</div>
        <span class="brand-name">Neuro<span class="brand-highlight">Vision</span></span>
      </div>
      <nav>
        <button id="navCalibrate" class="nav-btn">
          <span class="nav-icon">📏</span> Calibrate
        </button>
        <button id="navTrain" class="nav-btn">
          <span class="nav-icon">🎯</span> Train
        </button>
        <button id="navDashboard" class="nav-btn">
          <span class="nav-icon">📈</span> Dashboard
        </button>
        <button id="navSettings" class="nav-btn">
          <span class="nav-icon">⚙️</span> Settings
        </button>
      </nav>
    </div>
  </header>

  <main class="content-container">
    <div id="viewCalibrate" class="view-placeholder" style="display: none;"></div>
    <div id="viewTrain" class="view-placeholder" style="display: none;"></div>
    <div id="viewDashboard" class="view-placeholder" style="display: none;"></div>
    <div id="viewSettings" class="view-placeholder" style="display: none;"></div>

    <canvas id="trainingCanvas"></canvas>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
